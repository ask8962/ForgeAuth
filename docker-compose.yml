services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeauth-postgres
    environment:
      POSTGRES_USER: forgeauth
      POSTGRES_PASSWORD: password
      POSTGRES_DB: forgeauth
    ports:
      - "5432:5432"
    volumes:
      - forgeauth_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: forgeauth-redis
    ports:
      - "6379:6379"
    volumes:
      - forgeauth_redis_data:/data

volumes:
  forgeauth_pg_data:
  forgeauth_redis_data:
