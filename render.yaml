services:
  - type: web
    name: forgeauth-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    disk:
      name: forgeauth-keys
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: FORGEAUTH_OAUTH2_ISSUER
        value: https://forgeauth-api.onrender.com
      - key: FORGEAUTH_CORS_ALLOWED_ORIGINS
        value: https://forgeauth-frontend.vercel.app
      - key: FORGEAUTH_JWT_KEY_STORE_PATH
        value: /data/forgeauth-keys.json
      - key: FORGEAUTH_RATE_LIMITING_ENABLED
        value: "true"
