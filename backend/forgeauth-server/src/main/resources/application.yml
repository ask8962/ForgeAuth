spring:
  application:
    name: forgeauth-server

  datasource:
    url: jdbc:postgresql://localhost:5432/forgeauth
    username: forgeauth
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

forgeauth:
  jwt:
    key-store-path: ./forgeauth-keys.json
    access-token-expiration-sec: 900
    refresh-token-expiration-sec: 604800

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.forgeauth: INFO
    org.springframework.security: INFO
